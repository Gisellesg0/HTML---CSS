<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <style>
        /* seletores personalizados 
            # = id
           . = class
           : = pseudo - class
           :: = pseudo - element
           > = children 
            */
        body{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;

        }

        a{
            color: aqua;
            text-decoration: underline;
        }
          a:visited{
            color: black;
            text-decoration: underline;
          }

          a:hover{
            color: lemonchiffon;
          }

          a:active{
            color: yellow;
          }
          a::before{

          }
          a::after{
            content: '[link]';
            text-decoration: none;
            font-weight: normal;
            color: darkgray;
          }

        
    </style> 
</head>
<body>
    <h1>personaizando links</h1>

    </ul>
</body>
